name: Atualizar

# O robo inteiro: roda todo dia de madrugada, mede a rede, regenera a pagina
# e publica. Sem servidor, sem custo, sem voce lembrar de nada.

on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC = 03:17 em Sao Paulo
  workflow_dispatch:        # botao para rodar na mao quando quiser

permissions:
  contents: write   # para gravar os snapshots do historico
  pages: write
  id-token: write

concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Sem dependencias: o coletor usa so a biblioteca padrao. Isso e de
      # proposito - e o que faz o projeto continuar rodando daqui a dois anos
      # sem voce mexer em nada.
      # Os testes nao tocam a rede: rodam antes para nao publicar pagina
      # gerada por um commit que quebrou a classificacao.
      - name: Conferir a logica
        run: |
          python teste_local.py
          python teste_corporativo.py
          python teste_revalidar.py

      # Sem --limite: o coletor decide sozinho a fatia do dia (topo fixo +
      # um quinze avos da cauda), derivando do calendario. Ver coletor.py.
      - name: Coletar sinais da rede
        timeout-minutes: 90
        run: python coletor.py

      - name: Gerar a pagina
        # O endereco do repositorio vira o canal de contestacao da pagina.
        # Derivado do proprio contexto: nada para configurar, e nao quebra se
        # o repositorio for renomeado ou movido de conta.
        env:
          STILLALIVE_REPO: ${{ github.server_url }}/${{ github.repository }}
        run: python gerar_site.py

      # O historico e o que permite mostrar tendencia (queda de detentores).
      # Sem ele, a pagina so sabe o presente.
      - name: Guardar o snapshot do dia
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add historico dados.json
          # revalidacoes.json so passa a existir depois da primeira revalidacao
          # a pedido. Sem a guarda, o git add aborta e derruba a corrida inteira
          # depois da coleta ja ter rodado.
          if [ -f revalidacoes.json ]; then git add revalidacoes.json; fi
          git diff --staged --quiet || git commit -m "dados: $(date -u +%F)"
          git push

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: coletar
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Primeira execucao: o job "publicar" so passa depois que o Pages for
# ligado (source = GitHub Actions). Antes disso ele falha de proposito.
