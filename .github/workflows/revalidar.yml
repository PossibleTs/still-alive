name: Revalidar a pedido

# Atende a issue de revalidacao: mede o projeto de novo e responde ali mesmo.
# Os freios de abuso estao no revalidar.py, nao aqui - YAML e pessimo lugar
# para regra que precisa de teste.

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

# Divide a fila com a coleta diaria: as duas escrevem no dados.json e dao push.
concurrency:
  group: dados
  cancel-in-progress: false

jobs:
  medir:
    if: contains(github.event.issue.labels.*.name, 'revalidar')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # O texto daqui para baixo foi escrito por um estranho na internet. Ele
      # nunca entra em uma linha de shell por interpolacao do ${{ }}: entra por
      # variavel de ambiente, sempre. A interpolacao direta colocava o corpo da
      # issue dentro de `python ... --projeto "..."` e de `git commit -m "..."`,
      # e um `$(...)` ali executa no runner - que tem contents:write e o token
      # do repositorio. O label vem do formulario (labels: [revalidar]), ou
      # seja: qualquer pessoa dispara este workflow.
      - name: Ler o projeto pedido
        id: pedido
        env:
          CORPO: ${{ github.event.issue.body }}
          TITULO: ${{ github.event.issue.title }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import os, re
          corpo = os.environ.get("CORPO") or ""
          # O formulario rotula o campo em ingles ("### Project"); aceitar os
          # dois evita cair sempre no titulo por causa do idioma do rotulo.
          m = re.search(r"###\s*(?:Project|Projeto)\s*\n+([^\n]+)", corpo)
          nome = (m.group(1) if m else "").strip()
          if not nome or nome.startswith("_No response_"):
              nome = os.environ.get("TITULO", "").split(":", 1)[-1].strip()
          # Segunda camada, nao a primeira: nenhum nome do catalogo usa esses
          # caracteres (conferido nos 678), e todos servem para brincar com
          # shell ou com o $GITHUB_OUTPUT. # $ ( ) ? sobrevivem porque existem
          # em nome de token de verdade ($xLEMUR, "Got Jed?").
          nome = "".join(c for c in nome if c.isprintable() and c not in '`"\\;|<>{}&')
          nome = nome.replace("\n", " ").strip()[:80]
          print(f"projeto={nome}")
          PY

      - name: Medir
        id: medir
        env:
          PROJETO: ${{ steps.pedido.outputs.projeto }}
          AUTOR: ${{ github.event.issue.user.login }}
        run: |
          python revalidar.py --projeto "$PROJETO" --autor "$AUTOR" > resposta.md
          cat resposta.md

      - name: Responder na issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${{ github.event.issue.number }}" --body-file resposta.md

      - name: Guardar o resultado
        env:
          PROJETO: ${{ steps.pedido.outputs.projeto }}
        run: |
          git config user.name "robo"
          git config user.email "robo@users.noreply.github.com"
          git add dados.json revalidacoes.json
          git diff --staged --quiet || git commit -m "revalidacao: $PROJETO"
          git pull --rebase --autostash || true
          git push

# Indexado junto com o outro workflow: sem um push que toque o arquivo, o
# GitHub so o descobriria na primeira issue com o label revalidar.
