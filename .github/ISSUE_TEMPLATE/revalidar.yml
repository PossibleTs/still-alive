name: Recheck a project
description: Disagree with a call? Ask for a fresh measurement, right now.
title: "Recheck: "
labels: ["revalidar"]
body:
  - type: markdown
    attributes:
      value: |
        Most of the list is re-measured on a rotation, so the number you saw may
        be up to two weeks old. This asks for a fresh measurement now.

        The robot measures and answers in this same issue. It does not decide
        whether the criteria are fair — that is a conversation, and you can
        start it right below.

        Limits: a project is re-measured at most once every 12h, and each person
        can ask for 3 per day. It is not distrust of you — the public XRPL node
        is free out of courtesy, and courtesy runs out if we abuse it.
  - type: input
    id: projeto
    attributes:
      label: Project
      description: The name as it appears on the page, or the issuer address.
      placeholder: SOLO
    validations:
      required: true
  - type: textarea
    id: porque
    attributes:
      label: Why you think the call is wrong
      description: Optional, but it helps. If you are from the project, say so.
